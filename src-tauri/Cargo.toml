[workspace]
resolver = "2"
members = [
    "crates/sample-analysis-core",
    "crates/sample-library-core",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Audio decoding
symphonia = { version = "0.5", default-features = false, features = ["wav", "mp3", "flac", "ogg", "vorbis", "pcm", "aac"] }

# DSP
rustfft = "6.2"
realfft = "3.3"

# Array math
ndarray = "0.16"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Parallelism
rayon = "1.10"

# Error handling
thiserror = "2.0"

# --- Workspace profile optimizations for DSP crates ---

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# Optimize DSP crates even in dev mode
[profile.dev.package.sample-analysis-core]
opt-level = 3

[profile.dev.package.rustfft]
opt-level = 3

[profile.dev.package.realfft]
opt-level = 3

# --- App package ---

[package]
name = "sample-curator"
version = "0.1.0"
description = "Sample curation GUI for music-hub"
authors = [""]
license = ""
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
rodio = { version = "0.17", default-features = false, features = ["wav", "mp3", "flac", "vorbis"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }

# Native audio analysis (Rust implementation) — now local workspace crate
sample-analysis-core = { path = "crates/sample-analysis-core" }

# Library core (database, embeddings, similarity search) — now local workspace crate
sample-library-core = { path = "crates/sample-library-core" }

# Audio recording (sample-recorder integration)
cpal = "0.15"
hound = "3.5"
rustfft = "6.2"
crossbeam = "0.8"
chrono = "0.4"
dirs = "5.0"
trash = "3"

# Automation control channel (feature-gated)
tokio-tungstenite = { version = "0.24", optional = true }
tokio = { version = "1", features = ["net", "sync", "macros", "rt-multi-thread", "time", "io-util"], optional = true }
futures-util = { version = "0.3", optional = true }
base64 = { version = "0.22", optional = true }

[dev-dependencies]
tempfile = "3.14"

[features]
default = []
automation = ["tokio-tungstenite", "tokio", "futures-util", "base64"]
