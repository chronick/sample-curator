[package]
name = "sample-curator"
version = "0.1.0"
description = "Sample curation GUI for music-hub"
authors = [""]
license = ""
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.5", features = [ "protocol-asset", "dialog-all", "fs-all", "path-all"] }
rodio = { version = "0.17", default-features = false, features = ["wav", "mp3", "flac", "vorbis"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }

# Native audio analysis (Rust implementation)
sample-analysis-core = { path = "../../sample-analysis/crates/sample-analysis-core" }

# Library core (database, embeddings, similarity search)
sample-library-core = { path = "../../sample-library/crates/sample-library-core" }

[dev-dependencies]
tempfile = "3.14"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
