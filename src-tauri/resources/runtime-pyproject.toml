# Runtime pyproject for the uv-managed venv (vault-347l Phase 2).
#
# This file is bundled inside the .app at
# `Contents/Resources/runtime-pyproject.toml`.
# `deps_install` copies it into `~/.music-hub-data/python/runtime/` and
# runs `uv sync --extra X --extra Y` against it. The extras here mirror
# `sidecar/pyproject.toml` for the heavy ML libs only — sidecar's own
# core deps (numpy, librosa, sqlalchemy, etc.) ship inside the frozen
# sample-curation-api binary and are NOT replicated here.

[project]
name = "sample-curator-runtime"
version = "0.1.0"
description = "Heavy ML extras for Sample Curator (vault-347l Phase 2)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
embedding = [
    "transformers>=4.40",
    "torch>=2.0.0",
    "laion-clap>=1.1.0",
    "torchvision>=0.15.0",
]

transcription = [
    "faster-whisper>=1.0.0",
]

stems = [
    "demucs>=4.0.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    # torchaudio>=2.11 dropped builtin save/load backends; ml_worker
    # uses torchaudio.load/save in separate_demucs.
    "torchcodec>=0.11.0",
]

# accelerate intentionally absent — the worker calls
# AutoModelForCausalLM.from_pretrained() without device_map, so the
# model lands on plain CPU torch. See sidecar/sample_curation_api/llm.py.
llm-hf = [
    "transformers>=4.40",
    "torch>=2.0.0",
]

llm-ollama = [
    "ollama>=0.3.0",
]

# Tell uv this is a virtual project — no wheel ever built for the
# runtime project itself. Without this, `uv sync` invokes hatchling and
# fails with "Unable to determine which files to ship" because there's
# no source tree to package. Discovered while wiring vault-2nnt: any
# extra (stems / embedding / transcription / llm-hf) hits the same
# build-step before uv ever resolves transitive deps.
[tool.uv]
package = false
