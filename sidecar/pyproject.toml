[project]
name = "sample-curation-api"
version = "0.1.0"
description = "JSON-RPC API sidecar for Sample Curator GUI"
requires-python = ">=3.11"
license = { text = "MIT" }

# Core dependencies (sample-library and sample-analysis are now vendored locally)
dependencies = [
    # CLI and output
    "typer>=0.12.0",
    "rich>=13.0.0",
    # Audio I/O
    "soundfile>=0.12.0",
    "pydub>=0.25.0",
    "mutagen>=1.47.0",
    # Numerical
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    # Database
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    # DAG (for batch import pipeline)
    "networkx>=3.0",
    # Audio analysis (core)
    "librosa>=0.10.0",
    # Pin numba to version compatible with Python 3.11+
    "numba>=0.56.0",
    # Model weight downloads (vault-knuo). Lightweight (~600KB) — keeps the
    # ML features tab functional even on the bundled-sidecar install where
    # ML libs (torch/laion-clap/whisper/demucs) aren't shipped.
    "huggingface-hub>=0.20",
]

[project.optional-dependencies]
# Development tools
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

# PyInstaller toolchain — used by `npm run sidecar:bundle` and the
# release CI to freeze the sidecar into a self-contained binary that
# ships inside the .app (vault-3bd8). Lives in its own extra so dev
# and test environments don't pay the binary-bundling cost.
bundle = [
    "pyinstaller>=6.0.0",
]

# Audio fingerprinting for duplicate detection
fingerprint = [
    "pyacoustid>=1.3.0",
]

# CLAP embeddings for similarity search.
#
# The HF mirror at ``laion/clap-htsat-unfused`` ships transformers-format
# weights, not the laion-clap library's original ``.pt`` format. The
# ML-features tab loads via ``transformers.ClapModel``; ``laion-clap``
# stays available because ``naming.py`` still uses it for zero-shot
# classification on a different (LAION-format) checkpoint.
embedding = [
    "transformers>=4.40",
    "torch>=2.0.0",
    "laion-clap>=1.1.0",
    # laion-clap imports torchvision but doesn't declare it as a runtime dep.
    "torchvision>=0.15.0",
]

# Stem separation. torchcodec is required by torchaudio>=2.11 for
# load/save (the legacy soundfile/sox backends were removed). Pinning
# avoids a runtime ImportError when ml_worker.separate_demucs reads or
# writes wav files.
stems = [
    "demucs>=4.0.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "torchcodec>=0.11.0",
]

# Auto-mastering
mastering = [
    "matchering>=2.0.0",
]

# Change-point segmentation
segmentation = [
    "ruptures>=1.1.0",
]

# Speech transcription — used to derive filenames from vocal samples.
# faster-whisper is ~20MB (+ model download, tiny=75MB / base=142MB on first use);
# ~10x faster than openai-whisper and runs on CPU comfortably.
transcription = [
    "faster-whisper>=1.0.0",
]

# Local LLM refinement (via ollama) — one of three backends for the LLM
# naming-refinement feature. Requires a running local ollama daemon.
# Override the active model via `SAMPLE_CURATOR_OLLAMA_MODEL` or the
# Settings → ML features → Backend dropdown.
llm = [
    "ollama>=0.3.0",
]

# LLM refinement via HuggingFace transformers — second of three backends.
# Self-contained (no daemon required); first run downloads ~1 GB for the
# default Qwen 2.5 0.5B Instruct. transformers + torch already ship with
# the embedding extra, but we list them here so users can install
# `[llm-hf]` without pulling in CLAP.
#
# ``accelerate`` was previously required for ``device_map="cpu"`` but
# llm.py now omits device_map (CPU is the default) so accelerate is no
# longer needed for inference. Re-add if/when GPU/MPS dispatch lands.
llm-hf = [
    "transformers>=4.40",
    "torch>=2.0.0",
]

# All optional features
all = [
    "pyacoustid>=1.3.0",
    "laion-clap>=1.1.0",
    "torch>=2.0.0",
    "demucs>=4.0.0",
    "matchering>=2.0.0",
    "ruptures>=1.1.0",
    "faster-whisper>=1.0.0",
]

[project.scripts]
sample-curation-api = "sample_curation_api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sample_curation_api", "vendor"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v"
