[project]
name = "sample-curation-api"
version = "0.1.0"
description = "JSON-RPC API sidecar for Sample Curator GUI"
requires-python = ">=3.11"
license = { text = "MIT" }

# Core dependencies (sample-library and sample-analysis are now vendored locally)
dependencies = [
    # CLI and output
    "typer>=0.12.0",
    "rich>=13.0.0",
    # Audio I/O
    "soundfile>=0.12.0",
    "pydub>=0.25.0",
    "mutagen>=1.47.0",
    # Numerical
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    # Database
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    # DAG (for batch import pipeline)
    "networkx>=3.0",
    # Audio analysis (core)
    "librosa>=0.10.0",
    # Pin numba to version compatible with Python 3.11+
    "numba>=0.56.0",
]

[project.optional-dependencies]
# Development tools
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

# Audio fingerprinting for duplicate detection
fingerprint = [
    "pyacoustid>=1.3.0",
]

# CLAP embeddings for similarity search
embedding = [
    "laion-clap>=1.1.0",
    "torch>=2.0.0",
]

# Stem separation
stems = [
    "demucs>=4.0.0",
    "torch>=2.0.0",
]

# Auto-mastering
mastering = [
    "matchering>=2.0.0",
]

# Change-point segmentation
segmentation = [
    "ruptures>=1.1.0",
]

# All optional features
all = [
    "pyacoustid>=1.3.0",
    "laion-clap>=1.1.0",
    "torch>=2.0.0",
    "demucs>=4.0.0",
    "matchering>=2.0.0",
    "ruptures>=1.1.0",
]

[project.scripts]
sample-curation-api = "sample_curation_api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sample_curation_api", "vendor"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v"
