[project]
name = "sample-curation-api"
version = "0.1.0"
description = "JSON-RPC API for Sample Curator GUI"
requires-python = ">=3.11"
dependencies = [
    "sample-library",
    "sample-analysis",
    "numpy>=1.24",
]

[project.scripts]
sample-curation-api = "sample_curation_api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sample_curation_api"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
